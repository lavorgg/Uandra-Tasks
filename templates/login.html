<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E40AF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Uandra Tasks">
  <link rel="manifest" href="/static/manifest.json">
  <title>Entrar — Uandra Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --laranja: #F97316;
      --azul: #1E40AF;
      --azul-medio: #3B82F6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 400px;
    }

    .login-topo {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, var(--laranja), #EA580C);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(249, 115, 22, 0.3);
    }

    .login-titulo {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 26px;
      color: var(--azul);
      letter-spacing: -0.5px;
    }

    .login-titulo span {
      color: var(--laranja);
    }

    .login-subtitulo {
      font-size: 14px;
      color: #64748B;
      margin-top: 6px;
    }

    .login-card {
      background: white;
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 8px 40px rgba(30, 64, 175, 0.10);
      border: 1px solid #E2E8F0;
    }

    .campo {
      margin-bottom: 18px;
    }

    .campo label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: #64748B;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .campo-input-wrap {
      position: relative;
    }

    .campo-icone {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      pointer-events: none;
    }

    .campo input {
      width: 100%;
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      padding: 14px 16px 14px 44px;
      font-family: 'Nunito', sans-serif;
      font-size: 16px;
      color: #1E293B;
      outline: none;
      transition: all 0.2s;
      -webkit-appearance: none;
    }

    .campo input:focus {
      border-color: var(--laranja);
      background: white;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.12);
    }

    .dica {
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #1E40AF;
      margin-bottom: 22px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      line-height: 1.5;
    }

    .erro-msg {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      color: #DC2626;
      margin-bottom: 18px;
      font-weight: 600;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-entrar {
      width: 100%;
      background: linear-gradient(135deg, var(--laranja), #EA580C);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(249, 115, 22, 0.35);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-entrar:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(249, 115, 22, 0.4);
    }

    .btn-entrar:active {
      transform: scale(0.98);
    }

    .rodape-login {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #94A3B8;
    }
  </style>
</head>

<body>
  <div class="login-wrapper">
    <div class="login-topo">
      <div class="login-logo">⚡</div>
      <div class="login-titulo">Uandra <span>Tasks</span></div>
      <div class="login-subtitulo">Gerencie suas tarefas com facilidade</div>
    </div>

    <div class="login-card">
      {% if erro %}
      <div class="erro-msg">⚠️ {{ erro }}</div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <div class="campo">
          <label>Código de acesso</label>
          <div class="campo-input-wrap">
            <span class="campo-icone">👤</span>
            <input type="text" name="codigo" placeholder="Ex: 1" autocomplete="off" required>
          </div>
        </div>
        <div class="campo">
          <label>Senha</label>
          <div class="campo-input-wrap">
            <span class="campo-icone">🔒</span>
            <input type="password" name="senha" placeholder="Ex: 01011990" required>
          </div>
        </div>
        <div class="dica">
          💡 <span>A senha é a sua data de nascimento no formato <strong>DDMMAAAA</strong>.<br>Ex: nascido em 01/01/1990
            → senha: <strong>01011990</strong></span>
        </div>
        <button type="submit" class="btn-entrar">Entrar ➜</button>
      </form>
    </div>
    <div class="rodape-login">Uandra Tasks © 2026 | Todos os direitos reservados</div>
  </div>
</body>

</html>
